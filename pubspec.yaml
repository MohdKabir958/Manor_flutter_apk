name: mahogany_manor_prototype
description: Premium Mahogany Manor Bed and Breakfast Flutter client prototype
publish_to: none
version: 1.1.2+4
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/launcher_icon.png
  min_sdk_android: 21
flutter:
  uses-material-design: true
  assets:
    - assets/images/silhouette.jpg
